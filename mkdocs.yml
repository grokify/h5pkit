site_name: H5P Kit Documentation
site_description: Go SDK and TypeScript Editor for creating and editing H5P quiz content
site_author: Grokify
site_url: https://grokify.github.io/h5pkit/

repo_name: grokify/h5pkit
repo_url: https://github.com/grokify/h5pkit

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - guides/index.md
    - Getting Started:
      - Installation: guides/getting-started/installation.md
      - Quick Start: guides/getting-started/quick-start.md
      - Basic Concepts: guides/getting-started/concepts.md
    - Using the SDK:
      - Question Sets: guides/user-guide/question-sets.md
      - Typed Questions: guides/user-guide/typed-questions.md
      - Extensions: guides/user-guide/extensions.md
      - H5P Packages: guides/user-guide/h5p-packages.md
      - Validation: guides/user-guide/validation.md
    - TypeScript Editor:
      - Overview: guides/ts-editor/overview.md
      - Installation: guides/ts-editor/installation.md
      - React Usage: guides/ts-editor/react-usage.md
      - Vanilla JS: guides/ts-editor/vanilla-js.md
      - API Reference: guides/ts-editor/api-reference.md
    - Go API Reference:
      - Core Types: guides/api/core-types.md
      - Builder Pattern: guides/api/builder.md
      - Schemas: guides/api/schemas.md
      - Semantics: guides/api/semantics.md
    - Examples:
      - Basic Usage: guides/examples/basic.md
      - Advanced Usage: guides/examples/advanced.md
      - Package Creation: guides/examples/packages.md
    - Reference:
      - H5P Specification: guides/reference/h5p-spec.md
      - File Structure: guides/reference/file-structure.md
      - Standards Compliance: guides/reference/standards.md
      - Why H5P for Quizzes?: guides/reference/why-h5p-for-quizzes.md
    - Development:
      - Contributing: guides/development/contributing.md
      - Testing: guides/development/testing.md
      - Roadmap: guides/development/roadmap.md
  - Design:
    - design/index.md
    - Architecture:
      - H5P Editor: design/architecture/h5p-editor.md
    - Architecture Decisions: design/adrs/index.md
  - Specifications:
    - specs/index.md
    - "INIT-H5PKIT-001: Question Banks":
      - PRD: specs/initiatives/INIT-H5PKIT-001/PRD.md
      - TRD: specs/initiatives/INIT-H5PKIT-001/TRD.md
      - PLAN: specs/initiatives/INIT-H5PKIT-001/PLAN.md
      - ROADMAP: specs/initiatives/INIT-H5PKIT-001/ROADMAP.md
  - Releases:
    - releases/index.md
    - Changelog: releases/changelog.md
    - v0.5.0: releases/v0.5.0.md
    - v0.4.0: releases/v0.4.0.md
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md

plugins:
  - search
